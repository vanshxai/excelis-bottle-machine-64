<script>try{if(localStorage.getItem('navc')==='1')document.documentElement.classList.add('nav-collapsed')}catch(e){}</script>

  <nav>

      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="1.5" width="5" height="5" rx="1"/><rect x="9.5" y="1.5" width="5" height="5" rx="1"/><rect x="1.5" y="9.5" width="5" height="5" rx="1"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/></svg>
      <span class="label">Dashboard</span></a>
    <a href="/graph" class="{{ 'on' if active == 'graph' }}" title="Graph Explorer">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="3.5" cy="12" r="1.8"/><circle cx="12.5" cy="12" r="1.8"/><circle cx="8" cy="3.5" r="1.8"/><path d="M4.4 10.4 7.1 5.2M11.6 10.4 8.9 5.2M5.3 12h5.4"/></svg>

    <span class="label">Collapse</span>
  </button>

  <div class="foot">
    <div><span class="dot"></span><span class="txt">engine live</span></div>
    <div class="sub txt">{{ nav_stats.formulas }} formulas<br>{{ nav_stats.domains }} physics domains</div>
  </div>
</aside>
<script>
document.getElementById('navtoggle').onclick = function () {
  var c = document.documentElement.classList.toggle('nav-collapsed');
  try { localStorage.setItem('navc', c ? '1' : '0'); } catch (e) {}
  window.dispatchEvent(new Event('resize'));
};
</script>

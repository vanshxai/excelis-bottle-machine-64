<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yanthros Core — Graph Explorer</title>
<link rel="stylesheet" href="/static/nav.css">
<script src="/static/vendor/cytoscape.min.js"></script>
<style>
  :root{
    --bg:#07090d; --panel:#0f1319; --line:#1c232d; --txt:#c9d6e4; --dim:#6d8199;
    --accent:#4fc3f7; --source:#e0a940; --sink:#5ec269; --interior:#8a8fb8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--txt);
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}

  header{position:fixed;top:0;left:var(--nav-w);right:0;height:56px;display:flex;align-items:center;
    gap:18px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line);z-index:10}
  header a{color:var(--dim);text-decoration:none;font-size:12px}
  header a:hover{color:var(--accent)}
  h1{color:#fff;font-size:15px;letter-spacing:.03em}
  h1 span{color:var(--accent)}

  .search{position:relative;flex:1;max-width:420px}
  .search input{width:100%;background:#0a0e13;border:1px solid var(--line);color:var(--txt);
    padding:8px 12px;border-radius:6px;font:inherit;font-size:12.5px}
  .search input:focus{outline:none;border-color:var(--accent)}
  .results{position:absolute;top:38px;left:0;right:0;background:var(--panel);
    border:1px solid var(--line);border-radius:6px;max-height:280px;overflow-y:auto;display:none;z-index:20}
  .results.show{display:block}
  .rgroup{padding:6px 10px;color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
  .ritem{padding:7px 12px;cursor:pointer;font-size:12.5px}
  .ritem:hover{background:#16202c}

  .legend{display:flex;gap:14px;font-size:11px;color:var(--dim)}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}

  #cy{position:fixed;top:56px;left:var(--nav-w);right:340px;bottom:0}

  #panel{position:fixed;top:56px;right:0;bottom:0;width:340px;background:var(--panel);
    border-left:1px solid var(--line);padding:18px;overflow-y:auto}
  #panel h2{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
    margin-bottom:10px}
  #panel .hint{color:var(--dim);font-size:12px;line-height:1.6}
  .fcard{background:#0a0e13;border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:10px;
    cursor:pointer}
  .fcard:hover{border-color:var(--accent)}
  .fcard .fname{color:#fff;font-size:12.5px;font-weight:600}
  .fcard .feq{color:var(--accent);font-size:12px;margin-top:5px}
  .fcard .fdom{color:var(--dim);font-size:10.5px;margin-top:5px;text-transform:uppercase;letter-spacing:.06em}
  #empty{position:fixed;top:56%;left:calc(var(--nav-w) + (100vw - var(--nav-w) - 340px)/2);
    transform:translateX(-50%);color:var(--dim);font-size:12.5px;text-align:center}

  @media (max-width: 1100px) {
    html,body{height:auto;overflow:auto}
    header{position:static;flex-wrap:wrap;height:auto;padding:12px 16px}
    .legend{flex-wrap:wrap}
    #cy{position:relative;top:auto;left:auto;right:auto;bottom:auto;height:480px}
    #panel{position:static;width:auto;border-left:none;border-top:1px solid var(--line)}
    #empty{position:static;transform:none;padding:22px 16px}
  }
</style>
</head>
<body>
{% set active = 'graph' %}{% include '_nav.html' %}

<header>
  <h1>Graph Explorer</h1>
  <div class="search">
    <input id="searchbox" placeholder="Search a variable or formula name (e.g. torque, T_chip, ohms_law)..." autocomplete="off">
    <div class="results" id="results"></div>
  </div>
  <div class="legend">
    <span><i style="background:var(--source)"></i>source (must be given)</span>
    <span><i style="background:var(--interior)"></i>interior</span>
    <span><i style="background:var(--sink)"></i>sink (terminal output)</span>
  </div>
</header>

<div id="cy"></div>
<div id="empty">Search a variable or formula above to start exploring.<br>Click any node to expand its neighbors.</div>

<div id="panel">
  <h2>Details</h2>
  <div id="panelbody" class="hint">Nothing selected yet.</div>
</div>

<script>
const cy = cytoscape({
  container: document.getElementById('cy'),
  style: [
    { selector: 'node', style: {
        'background-color': ele => ({source:'#e0a940', sink:'#5ec269', interior:'#8a8fb8'})[ele.data('kind')] || '#8a8fb8',
        'label': 'data(id)', 'color': '#c9d6e4', 'font-size': 9, 'font-family': 'Menlo',
        'width': 16, 'height': 16, 'text-valign': 'bottom', 'text-margin-y': 4,
        'border-width': 2, 'border-color': '#07090d',
    }},
    { selector: 'edge', style: {
        'width': 1.4, 'line-color': '#2a3644', 'target-arrow-color': '#2a3644',
        'target-arrow-shape': 'triangle', 'curve-style': 'bezier', 'arrow-scale': 0.8,
    }},
    { selector: 'node:selected', style: { 'border-color': '#4fc3f7', 'border-width': 3 } },
  ],
  layout: { name: 'preset' },
});

let laidOutNodes = new Set();

function relayout() {
  cy.layout({ name: 'cose', animate: true, animationDuration: 400, fit: true, padding: 40,
              nodeRepulsion: 8000, idealEdgeLength: 70 }).run();
}

function mergeGraph(data) {
  document.getElementById('empty').style.display = 'none';
  data.nodes.forEach(n => {
    if (cy.getElementById(n.id).empty()) {
      cy.add({ group: 'nodes', data: { id: n.id, kind: n.kind } });
    }
  });
  data.edges.forEach(e => {
    const eid = e.formula + '::' + e.from + '->' + e.to;
    if (cy.getElementById(eid).empty()) {
      cy.add({ group: 'edges', data: { id: eid, source: e.from, target: e.to,
                                        formula: e.formula, domain: e.domain, equation: e.equation } });
    }
  });
  relayout();
  showFormulaList(data.formulas);
}

function showFormulaList(formulas) {
  const body = document.getElementById('panelbody');
  if (!formulas || !formulas.length) { body.innerHTML = '<div class="hint">No formulas found.</div>'; return; }
  body.innerHTML = formulas.map(f => `
    <div class="fcard" onclick="expandFormula('${f.name}')">
      <div class="fname">${f.name}</div>
      <div class="feq">${f.equation}</div>
      <div class="fdom">${f.domain}</div>
    </div>`).join('');
}

function expandNode(symbol) {
  fetch('/api/expand?node=' + encodeURIComponent(symbol)).then(r => r.json()).then(mergeGraph);
}
function expandFormula(name) {
  fetch('/api/expand?formula=' + encodeURIComponent(name)).then(r => r.json()).then(mergeGraph);
}

cy.on('tap', 'node', evt => expandNode(evt.target.id()));

// --- search box ---
const box = document.getElementById('searchbox');
const results = document.getElementById('results');
let debounce;
box.addEventListener('input', () => {
  clearTimeout(debounce);
  const q = box.value.trim();
  if (!q) { results.classList.remove('show'); return; }
  debounce = setTimeout(() => {
    fetch('/api/search?q=' + encodeURIComponent(q)).then(r => r.json()).then(data => {
      let html = '';
      if (data.symbols && data.symbols.length) {
        html += '<div class="rgroup">Variables</div>';
        html += data.symbols.map(s => `<div class="ritem" onclick="pick('node','${s}')">${s}</div>`).join('');
      }
      if (data.formulas && data.formulas.length) {
        html += '<div class="rgroup">Formulas</div>';
        html += data.formulas.map(f => `<div class="ritem" onclick="pick('formula','${f}')">${f}</div>`).join('');
      }
      results.innerHTML = html || '<div class="ritem" style="color:#6d8199">No matches</div>';
      results.classList.add('show');
    });
  }, 150);
});
document.addEventListener('click', e => { if (!e.target.closest('.search')) results.classList.remove('show'); });

function pick(type, value) {
  results.classList.remove('show');
  box.value = value;
  if (type === 'node') expandNode(value); else expandFormula(value);
}
</script>
</body>
</html>

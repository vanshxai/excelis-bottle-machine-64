<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Formula flow</title>
<style>
:root{--bg:#07090d;--panel:#0f1319;--panel2:#141b24;--line:#1c232d;--txt:#c9d6e4;--dim:#6d8199;--accent:#4fc3f7;--amb:#e0a940;--ok:#5ec269;--bad:#e5534b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif}
header{height:54px;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:15px;margin:0;color:#fff}header h1 span{color:var(--accent)}
select,input{background:#0a0e13;border:1px solid var(--line);color:var(--txt);padding:6px 8px;border-radius:5px;font:inherit;font-size:13px}
input[type=number]{width:110px}input[type=range]{width:100%;padding:0}
a{color:var(--accent);text-decoration:none;font-size:13px}
#wrap{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 54px)}
#side{padding:16px 18px 60px;border-right:1px solid var(--line);background:var(--panel)}
#main{padding:20px 24px 80px;overflow:auto}
h3{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:20px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
h3:first-child{margin-top:0}
.f{margin:9px 0}.f label{display:block;color:var(--txt);font-size:13px}.f .row{display:flex;gap:8px;align-items:center;margin-top:3px}
.u{color:var(--dim);font-size:12px}.mod{color:var(--amb)}.reset{font-size:11px;color:var(--amb);cursor:pointer;margin-left:6px}
.note{color:var(--dim);font-size:11.5px}
#crumbs{color:var(--dim);margin-bottom:6px}#crumbs b{color:#fff}
#status{color:var(--dim);font-size:12px;margin-bottom:14px}#status b{color:var(--ok)}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:0;margin:10px 0 6px}
.arrow{align-self:center;color:var(--dim);font-size:22px;padding:0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:210px;max-width:300px;margin:6px 0}
.card.load{border-color:#2a4a62}.card.cur{border-color:#5c4710}.card.kt{border-color:#2d3a2a}
.card h4{margin:0 0 4px;font-size:13px;color:#fff}.card .stage{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.eq{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--accent);margin:4px 0}
.solved{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#9fb2c5}
.vals{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;margin-top:6px}
.vals div{display:flex;justify-content:space-between;gap:12px}
.out{color:#fff;font-weight:600;border-top:1px solid var(--line);margin-top:5px;padding-top:4px}
.chg{animation:flash 1.1s ease-out}@keyframes flash{0%{background:#5c4710;color:#fff}100%{background:transparent}}
.pill{display:inline-block;padding:1px 9px;border-radius:10px;font-size:11px;font-weight:600;color:#06121a}
.big{font-size:22px;color:#fff;font-weight:600}
table{border-collapse:collapse;width:100%;font-size:12.5px}th{text-align:left;color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase;padding:5px 6px;border-bottom:1px solid var(--line)}
td{padding:5px 6px;border-bottom:1px solid #131a22}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:10px 0}
.err{background:#2a1214;border:1px solid #5a2024;color:#ffb3ad;border-radius:6px;padding:10px 12px}
</style></head><body>
<header><h1>Formula <span>flow</span></h1><a href="/">&larr; builder</a><label class="u">part</label><select id="part"></select>
<span class="u" id="proj"></span><span style="margin-left:auto"></span><a id="dl" href="#">download rulebook.json</a></header>
<div id="wrap"><div id="side"></div><div id="main"><div id="crumbs"></div><div id="status"></div><div id="flow"></div><div id="ladder"></div><div id="rules"></div></div></div>
<script>
const Q=new URLSearchParams(location.search),NAME=Q.get('name')||'mini_sorter';
const $=s=>document.querySelector(s),api=async(p,b)=>(await fetch(p,b===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=v=>{if(v===0)return'0';const a=Math.abs(v);return a>=1000?v.toFixed(0):a>=100?v.toFixed(1):a>=1?v.toFixed(3):a>=0.01?v.toFixed(4):v.toExponential(2);};
let PART=null,OV,EFFORT,PREV={},RB=null,TIMER=null,IDX=null,PJ=null,BASE=null;
const BANDC={fine:'#5ec269',elevated:'#e8cf5a',warning:'#e0a940',critical:'#e5534b'};

async function init(){
 $('#proj').textContent='project: '+NAME;$('#dl').href='/api/rulebook_file?name='+NAME;
 PJ=await api('/api/project?name='+NAME);IDX=PJ.index;RB=(await api('/api/rulebook?name='+NAME)).rulebook;
 const sims=Object.keys(PJ.signatures.parts);
 $('#part').innerHTML=sims.map(p=>`<option value="${p}">${p} ${esc(IDX.parts[p].description)}</option>`).join('');
 $('#part').onchange=()=>choose($('#part').value);
 choose(Q.get('part')&&sims.includes(Q.get('part'))?Q.get('part'):(sims.includes('MS00305')?'MS00305':sims[0]));
}
function choose(p){PART=p;$('#part').value=p;OV={constants:{},motor:{},levels:{}};EFFORT=null;PREV={};BASE=null;recompute(true);}
async function recompute(rebuild){
 const t0=performance.now();
 const r=await api('/api/trace',{name:NAME,part:PART,effort:EFFORT,overrides:OV});
 const ms=performance.now()-t0;
 if(!r.ok){$('#flow').innerHTML=`<div class="err">${esc(r.error)}</div>`;return;}
 if(!BASE){BASE={};r.variables.forEach(v=>BASE[v.key]=v.value);BASE.delta=r.delta_current_A;}
 if(rebuild)controls(r);
 render(r,ms);
}
function controls(r){
 const g={load:[],part:[],motor:[],levels:[]};r.variables.forEach(v=>g[v.group].push(v));
 const field=v=>{
  const mod=v.group==='part'?(OV.constants[v.key]!==undefined):v.group==='motor'?(OV.motor[v.key]!==undefined):v.group==='levels'?(OV.levels[v.key]!==undefined):(EFFORT!==null);
  const slider=v.key==='effort'?`<input type="range" min="0" max="${v.max}" step="${v.max/400}" value="${v.value}" data-k="effort" data-g="load">`:'';
  return `<div class="f"><label>${esc(v.label)}${v.note?` <span class="note">(${esc(v.note)})</span>`:''}<span class="reset" data-reset="${v.key}" style="display:none">reset</span></label>
   ${slider}<div class="row"><input type="number" step="any" value="${v.value}" data-k="${v.key}" data-g="${v.group}"><span class="u">${esc(v.unit)}</span></div></div>`;};
 $('#side').innerHTML=`<h3>Load applied to this part</h3>${g.load.map(field).join('')}
  <h3>Values of this part</h3>${g.part.length?g.part.map(field).join(''):'<div class="note">this part has no values of its own besides the load</div>'}
  <h3>Motor nameplate</h3>${g.motor.map(field).join('')}
  <h3>Your three levels</h3>${g.levels.map(field).join('')}
  <div style="margin-top:18px"><button id="rst" style="background:#141b24;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:7px 12px;cursor:pointer">Reset everything to the built values</button></div>`;
 $('#side').querySelectorAll('input[data-k]').forEach(i=>i.oninput=()=>{
  const k=i.dataset.k,gr=i.dataset.g,val=Number(i.value);if(i.value===''||isNaN(val))return;
  if(gr==='load'){EFFORT=val;$('#side').querySelectorAll('input[data-k="effort"]').forEach(o=>{if(o!==i)o.value=val;});}
  else if(gr==='part')OV.constants[k]=val;else if(gr==='motor')OV.motor[k]=val;else OV.levels[k]=val;
  const rs=$('#side').querySelector(`[data-reset="${k}"]`);if(rs)rs.style.display='inline';
  clearTimeout(TIMER);TIMER=setTimeout(()=>recompute(false),60);});
 $('#side').querySelectorAll('[data-reset]').forEach(rs=>rs.onclick=()=>{const k=rs.dataset.reset;delete OV.constants[k];delete OV.motor[k];delete OV.levels[k];if(k==='effort')EFFORT=null;recompute(true);});
 $('#rst').onclick=()=>choose(PART);
}
function card(s,idx){
 const stage={motor_constant:'Motor, from the nameplate',chain:'This part\'s chain',current:'Motor current'}[s.stage]||s.stage;
 const rows=Object.entries(s.inputs).map(([k,v])=>{const key=idx+':'+k;const c=PREV[key]!==undefined&&PREV[key]!==v;PREV[key]=v;return `<div class="${c?'chg':''}"><span>${esc(k)}</span><span>${fmt(v)}</span></div>`;}).join('');
 const ko=idx+':out';const c=PREV[ko]!==undefined&&PREV[ko]!==s.output.value;PREV[ko]=s.output.value;
 return `<div class="card ${s.stage==='motor_constant'?'kt':s.stage==='current'?'cur':''}"><div class="stage">${stage}</div><h4>${esc(s.formula)}</h4>
  <div class="eq">${esc(s.equation)}</div><div class="solved">solved for: ${esc(s.solved)}</div>
  <div class="vals">${rows}<div class="out ${c?'chg':''}"><span>${esc(s.output.name)} =</span><span>${fmt(s.output.value)}</span></div></div></div>`;
}
function render(r,ms){
 const crumbs=r.chain.map(p=>`<b>${p}</b> ${esc((IDX.parts[p]||{}).description||'')}`).join(' &rarr; ');
 $('#crumbs').innerHTML='Drive chain, this part to the motor: '+crumbs;
 $('#status').innerHTML=`<b>Recomputed ${r.steps.length} formula steps from scratch in ${ms.toFixed(0)} ms.</b> Change any value on the left and every formula below runs again.`;
 const kt=r.steps.filter(s=>s.stage==='motor_constant').map((s,i)=>card(s,'k'+i)).join('');
 const chain=r.steps.filter(s=>s.stage==='chain').map((s,i)=>card(s,'c'+i));
 const cur=r.steps.filter(s=>s.stage==='current').map((s,i)=>card(s,'u'+i)).join('');
 const eKey='load:e';const ec=PREV[eKey]!==undefined&&PREV[eKey]!==r.effort;PREV[eKey]=r.effort;
 const load=`<div class="card load"><div class="stage">Start: the load you apply</div><h4>${esc(r.effort_label)}</h4>
  <div class="big ${ec?'chg':''}">${fmt(r.effort)} <span class="u">${esc(r.effort_unit)}</span></div>
  <div class="note">at ${esc(r.part)} ${esc(r.description)}; passed up through: ${esc(r.chain.slice(1).join(' > '))}</div></div>`;
 const tq=`<div class="card"><div class="stage">Arrives at the motor shaft</div><h4>Extra torque</h4><div class="big">${fmt(r.motor_torque_Nm)} <span class="u">N*m</span></div></div>`;
 const pill=`<span class="pill" style="background:${BANDC[r.band]}">${r.band}</span>`;
 const ds=r.delta_current_A-BASE.delta,dl=BASE.delta?(ds/BASE.delta*100):0;
 const result=`<div class="card cur" style="min-width:230px"><div class="stage">Result</div><h4>Extra current on ${esc(r.motor)}</h4>
  <div class="big">${fmt(r.delta_current_A)} <span class="u">A</span> ${pill}</div>
  <div class="note">${Math.abs(dl)<0.05?'same as the built values':(ds>0?'+':'')+dl.toFixed(1)+'% vs the built values'}</div>
  <div class="note">fine up to ${fmt(r.levels_A.ok_max)} A &middot; warning ${fmt(r.levels_A.warning)} A &middot; critical ${fmt(r.levels_A.critical)} A</div></div>`;
 $('#flow').innerHTML=`<h3 style="margin-top:0">Motor constant (feeds the last step)</h3><div class="flow">${kt}</div>
  <h3>Calculation flow</h3><div class="flow">${load}<span class="arrow">&rarr;</span>${chain.join('<span class="arrow">&rarr;</span>')}${chain.length?'<span class="arrow">&rarr;</span>':''}${tq}<span class="arrow">&rarr;</span>${cur}<span class="arrow">&rarr;</span>${result}</div>`;
 ladder(r);rules(r);
}
function ladder(r){
 const m=RB.motors[r.motor],W=760,L=150,RH=30,top=26,Hh=top+m.parts.length*RH+60;
 const xmax=Math.max(...m.parts.map(p=>p.max_modelled_delta_A),r.delta_current_A*1.05)*1.04,X=a=>L+(W-L-10)*a/xmax;
 let s=`<svg viewBox="0 0 ${W} ${Hh}" width="100%" style="background:#0f1319;border:1px solid #1c232d;border-radius:8px">`;
 s+=`<rect x="${X(0)}" y="${top-6}" width="${X(RB.tolerance_A)-X(0)}" height="${m.parts.length*RH+8}" fill="#222b36"/><text x="${X(0)+2}" y="${top-10}" fill="#6d8199" font-size="10">noise</text>`;
 m.parts.forEach((p,i)=>{const y=top+i*RH;
  s+=`<text x="8" y="${y+15}" fill="${p.part===r.part?'#fff':'#9fb2c5'}" font-size="12">${p.part} ${esc(p.description.slice(0,16))}</text>`;
  p.bands.forEach(b=>{s+=`<rect x="${X(b.delta_A[0])}" y="${y+3}" width="${Math.max(1,X(b.delta_A[1])-X(b.delta_A[0]))}" height="${RH-10}" fill="${BANDC[b.band]}" opacity="${p.part===r.part?1:.45}"><title>${p.part}: ${b.band}, extra current ${fmt(b.delta_A[0])} to ${fmt(b.delta_A[1])} A</title></rect>`;});
  if(!p.detectable)s+=`<text x="${X(0)+2}" y="${y+RH-12}" fill="#e5534b" font-size="10">below the sensor limit even at critical</text>`;});
 const yb=top+m.parts.length*RH+6;
 s+=`<text x="8" y="${yb+14}" fill="#9fb2c5" font-size="12">area to look at</text>`;
 m.current_ladder.forEach(seg=>{s+=`<rect x="${X(seg.delta_A[0])}" y="${yb}" width="${Math.max(2,X(seg.delta_A[1])-X(seg.delta_A[0]))}" height="22" fill="${seg.kind==='part'?'#1d4a63':'#4a3a14'}" stroke="#0f1319"><title>${seg.parts.join(', ')} -> ${esc(seg.area)}</title></rect>`;
  if(X(seg.delta_A[1])-X(seg.delta_A[0])>70)s+=`<text x="${X(seg.delta_A[0])+4}" y="${yb+15}" fill="#fff" font-size="10">${esc(seg.area.slice(0,22))}</text>`;});
 s+=`<line x1="${X(r.delta_current_A)}" x2="${X(r.delta_current_A)}" y1="${top-8}" y2="${yb+26}" stroke="#fff" stroke-dasharray="4 3"/><text x="${Math.min(X(r.delta_current_A)+4,W-120)}" y="${top-12}" fill="#fff" font-size="11">now ${fmt(r.delta_current_A)} A</text>`;
 s+=`<text x="${L}" y="${Hh-6}" fill="#6d8199" font-size="10">0</text><text x="${W-60}" y="${Hh-6}" fill="#6d8199" font-size="10">${fmt(xmax)} A extra current</text></svg>`;
 $('#ladder').innerHTML=`<h3>Fault current ranges on ${esc(r.motor)} (${esc(m.description)})</h3>${s}<div class="note" style="margin-top:4px">Each row is one part: the colours are its fine / elevated / warning / critical ranges in extra motor current. The bottom strip says which area to look at when the current change falls in that range.</div>`;
}
function rules(r){
 const st=RB.style;
 const leg=['fine','elevated','warning','critical'].map(k=>[k,st[k]]).map(([k,v])=>`<tr><td><span class="pill" style="background:${v.color}">${v.label}</span></td><td>${esc(v.rule)}</td></tr>`).join('');
 const m=RB.motors[r.motor];
 const rows=m.parts.map(p=>p.bands.map((b,i)=>`<tr><td>${i?'':'<b>'+p.part+'</b> '+esc(p.description)}</td><td><span class="pill" style="background:${BANDC[b.band]}">${b.band}</span></td><td>${fmt(b.effort[0])} to ${fmt(b.effort[1])} ${esc(p.unit)}</td><td>${fmt(b.delta_A[0])} to ${fmt(b.delta_A[1])} A</td></tr>`).join('')).join('');
 $('#rules').innerHTML=`<h3>The rulebook (saved as rulebook.json in the project)</h3><div class="box"><b>Warning style</b>: four levels, defined by the three numbers you typed for each part. No other rule is added by the software.<table style="margin-top:6px">${leg}</table></div>
  <div class="box"><table><tr><th>Part</th><th>Level</th><th>Load range</th><th>Extra motor current</th></tr>${rows}</table>
  <div class="note" style="margin-top:6px">Current changes smaller than ${RB.tolerance_A} A are treated as noise.</div></div>`;
}
init();
</script></body></html>
